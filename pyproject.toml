[project]
name = "tree-interactions"
version = "0.1.0"
description = "Detecting feature interactions in tree ensembles: Friedman H-statistic vs split-path scores, with planted ground truth and an interactive report"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
